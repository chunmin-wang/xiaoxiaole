<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>周周消消乐 · Zhou Zhou Match</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --cell: 48px; --gap: 5px; --board-pad: 10px; }
  html, body { height: 100%; }
  body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; background: linear-gradient(160deg, #5b2a86 0%, #a2379c 55%, #e2588b 100%); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; overflow-y: auto; user-select: none; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(circle at 12% 18%, rgba(255,255,255,.16) 0, transparent 42px), radial-gradient(circle at 85% 12%, rgba(255,255,255,.12) 0, transparent 60px), radial-gradient(circle at 78% 82%, rgba(255,255,255,.14) 0, transparent 50px), radial-gradient(circle at 22% 78%, rgba(255,255,255,.10) 0, transparent 45px); }
  .game-wrap { position: relative; z-index: 1; margin: auto 0; width: 100%; max-width: 520px; padding: 8px 12px; box-sizing: border-box; }
  .game-title { text-align: center; font-size: 26px; font-weight: 900; letter-spacing: 3px; text-shadow: 0 3px 8px rgba(0,0,0,.35); margin-bottom: 2px; }
  .level-name { text-align: center; font-size: 13px; opacity: .9; margin-bottom: 12px; letter-spacing: 1px; }
  .hud { display: flex; align-items: stretch; gap: 8px; margin-bottom: 12px; }
  .hud .stat { flex: 1; min-width: 0; }
  .stat { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); border-radius: 14px; padding: 8px 10px; min-width: 0; text-align: center; backdrop-filter: blur(4px); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .stat .label { font-size: 11px; opacity: .85; letter-spacing: 1px; }
  .stat .value { font-size: 22px; font-weight: 800; line-height: 1.15; text-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .stat.target .value { font-size: 17px; }
  .board-box { position: relative; width: fit-content; margin: 0 auto; background: rgba(255,255,255,.13); border: 2px solid rgba(255,255,255,.35); border-radius: 20px; padding: var(--board-pad); box-shadow: 0 18px 50px rgba(0,0,0,.4), inset 0 0 30px rgba(255,255,255,.08); }
  .board { position: relative; width: calc(var(--cell) * 8 + var(--gap) * 7); height: calc(var(--cell) * 8 + var(--gap) * 7); background: rgba(30,10,50,.25); border-radius: 12px; overflow: hidden; touch-action: none; }
  .cell-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); gap: var(--gap); padding: 0; }
  .cell-grid i { background: rgba(255,255,255,.05); border-radius: 10px; }
  .tile { position: absolute; width: var(--cell); height: var(--cell); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cell) * 0.58); cursor: pointer; touch-action: none; -webkit-user-select: none; user-select: none; transition: transform .18s ease, box-shadow .18s ease, opacity .25s ease; will-change: transform; z-index: 2; transform: translate(var(--tx, 0px), var(--ty, 0px)); background: rgba(255,255,255,.08); box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.22); }
  .tile .gem { width: 86%; height: 86%; object-fit: contain; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); -webkit-user-drag: none; pointer-events: none; }
  .tile.selected { outline: 3px solid #fff; outline-offset: -1px; transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.14); box-shadow: 0 0 0 4px rgba(255,255,255,.35), 0 8px 20px rgba(0,0,0,.4); z-index: 6; animation: pulse 0.9s ease-in-out infinite; }
  .tile.pressed { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.1); box-shadow: 0 0 0 3px rgba(255,255,255,.55), 0 8px 22px rgba(0,0,0,.45); z-index: 6; }
  @keyframes pulse { 0%,100% { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.12); } 50% { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.18); } }
  .tile.hint { animation: hintPop 1.1s ease-in-out infinite; }
  @keyframes hintPop { 0%,100% { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1); box-shadow: 0 0 0 0 rgba(255,220,80,.7); } 50% { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.12); box-shadow: 0 0 0 8px rgba(255,220,80,0); } }
  .tile.pop { animation: popAnim .35s ease forwards; z-index: 5; }
  @keyframes popAnim { 0% { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1); opacity: 1; } 40% { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(1.3) rotate(10deg); opacity: 1; } 100% { transform: translate(var(--tx, 0px), var(--ty, 0px)) scale(0); opacity: 0; } }
  .tile.sp-row, .tile.sp-col { box-shadow: 0 0 0 3px #ffd700, 0 0 14px rgba(255,215,0,.7), inset 0 -4px 0 rgba(0,0,0,.18); z-index: 3; }
  .tile.sp-bomb { box-shadow: 0 0 0 3px #ff6b35, 0 0 18px rgba(255,107,53,.8), inset 0 -4px 0 rgba(0,0,0,.18); z-index: 3; animation: bombGlow 1s ease-in-out infinite; }
  @keyframes bombGlow { 0%,100% { box-shadow: 0 0 0 3px #ff6b35, 0 0 14px rgba(255,107,53,.7); } 50% { box-shadow: 0 0 0 5px #ff6b35, 0 0 26px rgba(255,107,53,1); } }
  .tile .sp-badge { position: absolute; right: -3px; top: -3px; font-size: 12px; z-index: 4; background: #fff; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.4); pointer-events: none; }
  .score-pop { position: absolute; font-weight: 900; font-size: 26px; color: #ffe66d; text-shadow: 0 2px 0 rgba(120,40,0,.5), 0 4px 14px rgba(0,0,0,.5); pointer-events: none; z-index: 20; animation: floatUp 0.9s ease-out forwards; }
  @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { transform: translateY(-10px) scale(1.15); opacity: 1; } 100% { transform: translateY(-60px) scale(1); opacity: 0; } }
  .combo-banner { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 30px; font-weight: 900; color: #fff; letter-spacing: 2px; text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 24px rgba(255,215,0,.9); z-index: 30; pointer-events: none; animation: comboPop 1.1s ease forwards; white-space: nowrap; }
  @keyframes comboPop { 0% { transform: translate(-50%,-50%) scale(.3) rotate(-8deg); opacity: 0; } 25% { transform: translate(-50%,-50%) scale(1.25) rotate(3deg); opacity: 1; } 45% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 1; } 80% { transform: translate(-50%,-50%) scale(1.05); opacity: 1; } 100% { transform: translate(-50%,-50%) scale(1.15); opacity: 0; } }
  .controls { display: flex; gap: 10px; margin-top: 14px; justify-content: center; }
  .btn { flex: 1; border: none; cursor: pointer; background: linear-gradient(180deg, #ffd166, #ff9f43); color: #6b3b00; font-weight: 800; font-size: 16px; padding: 11px 0; border-radius: 13px; box-shadow: 0 5px 0 #d17f2a, 0 8px 18px rgba(0,0,0,.3); transition: transform .08s ease, box-shadow .08s ease; letter-spacing: 1px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #d17f2a; }
  .btn.secondary { background: linear-gradient(180deg,#8fd3ff,#4aa3ff); color: #073a63; box-shadow: 0 5px 0 #2f7dd0; }
  .overlay { position: fixed; inset: 0; z-index: 100; background: rgba(30,8,50,.72); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; transition: opacity .3s ease; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .panel { background: linear-gradient(180deg, #7b2f9e, #5b1f7d); border: 2px solid rgba(255,255,255,.4); border-radius: 24px; padding: 24px 26px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 24px 70px rgba(0,0,0,.55); animation: panelIn .35s ease; max-height: 92vh; overflow-y: auto; }
  @keyframes panelIn { 0% { transform: scale(.7); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .panel h1 { font-size: 34px; letter-spacing: 2px; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .panel .sub { margin-top: 10px; font-size: 15px; opacity: .92; line-height: 1.6; }
  .panel .big { font-size: 20px; font-weight: 800; margin-top: 12px; }
  .panel .rule { background: rgba(255,255,255,.1); border-radius: 12px; padding: 12px 14px; margin: 16px 0; font-size: 13.5px; line-height: 1.7; text-align: left; }
  .panel .rule b { color: #ffe66d; }
  .panel .btn { width: 100%; margin-top: 6px; font-size: 18px; }
  .stars { font-size: 40px; margin: 10px 0; letter-spacing: 6px; }
  .level-list { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
  .level-card { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.28); border-radius: 14px; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: transform .1s ease, border-color .1s ease, background .1s ease; }
  .level-card:hover { transform: scale(1.02); border-color: rgba(255,255,255,.5); }
  .level-card.locked { opacity: .45; cursor: not-allowed; }
  .level-card .lv-name { font-weight: 800; font-size: 16px; }
  .level-card .lv-info { font-size: 12px; opacity: .85; margin-top: 2px; }
  .level-card .lv-stars { font-size: 17px; letter-spacing: 2px; margin: 0 10px; }
  .level-card .play { font-size: 20px; color: #ffe66d; }
  .confetti { position: fixed; top: -20px; width: 10px; height: 14px; z-index: 90; pointer-events: none; opacity: .95; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>

<div class="game-wrap">
  <div class="game-title">🌟 周周消消乐</div>
  <div class="level-name" id="levelTag">第 1/3 关</div>
  <div class="hud">
    <div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="stat target"><div class="label">目标</div><div class="value" id="target">1000</div></div>
    <div class="stat"><div class="label">剩余步数</div><div class="value" id="moves">20</div></div>
  </div>
  <div class="board-box"><div class="board" id="board"><div class="cell-grid" id="cellGrid"></div></div></div>
  <div class="controls">
    <button class="btn secondary" id="hintBtn">💡 提示</button>
    <button class="btn secondary" id="restartBtn">🔄 重开</button>
    <button class="btn secondary" id="levelBtn">🏠 选关</button>
  </div>
</div>
<div class="overlay" id="startOverlay">
  <div class="panel">
    <h1>🌟 周周消消乐</h1>
    <div class="sub">闯关模式 · 三消 · 连击加成 · 特殊棋子</div>
    <div class="rule"><b>玩法：</b>点击选中或<b>拖动</b>交换相邻小伙伴。<br>3个连线消除，连续消除触发<b>连击</b>！<br><b>4消</b>生成金框↔↕棋子（清整行/列）；<br><b>5消或T/L形</b>生成橙框💣炸弹（炸3×3）！</div>
    <button class="btn" id="startBtn" style="width:100%;margin-top:4px;font-size:20px;padding:14px 0;">🎮 开始游戏</button>
    <div class="level-list" id="levelList" style="margin-top:14px;"></div>
  </div>
</div>
<div class="overlay hidden" id="resultOverlay">
  <div class="panel">
    <div class="stars" id="stars">⭐⭐⭐</div>
    <h1 id="resultTitle">通关！</h1>
    <div class="big" id="resultScore">得分 0</div>
    <div class="sub" id="resultMsg"></div>
    <button class="btn" id="againBtn">🔁 再来一局</button>
  </div>
</div>

  { name:"", types:6, moves:20, target:1600 },
  { name:"", types:8, moves:18, target:2000 }
];
const DRAG_THRESHOLD = 18;
let board = [], sp = [], score = 0, movesLeft = 20, selected = null, busy = false, hintTimer = null, gameEnded = false, currentLevel = 0, unlockedLevels = 1, levelStars = [0,0,0], dragState = null, swapPositions = [];
const boardEl = document.getElementById("board"), cellGridEl = document.getElementById("cellGrid"), scoreEl = document.getElementById("score"), targetEl = document.getElementById("target"), movesEl = document.getElementById("moves"), levelTagEl = document.getElementById("levelTag"), levelListEl = document.getElementById("levelList");
let CELL = 48, GAP = 5, STEP = 53;
function fitBoard() { const wrap = document.querySelector(".game-wrap"); if (!wrap) return; const avail = wrap.clientWidth - 24; const gap = Math.max(3, Math.min(6, Math.round(avail * 0.012))); const maxCell = Math.min(52, Math.floor((avail - gap * 7 - 24) / 8)); const cell = Math.max(24, maxCell); const root = document.documentElement; root.style.setProperty("--cell", cell + "px"); root.style.setProperty("--gap", gap + "px"); CELL = cell; GAP = gap; STEP = cell + gap; boardEl.querySelectorAll(".tile").forEach(el => { const r = Number(el.dataset.r), c = Number(el.dataset.c); el.style.setProperty("--tx", (c * STEP) + "px"); el.style.setProperty("--ty", (r * STEP) + "px"); }); }
window.addEventListener("resize", fitBoard);
let audioCtx = null;
function beep(freq, dur, type="sine", vol=0.12) { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + dur); } catch(e) {} }
function sfxSelect() { beep(520, .07, "sine", .08); }
function sfxSwap() { beep(660, .06, "triangle", .08); }
function sfxBad() { beep(180, .16, "sawtooth", .08); }
function sfxMatch(n) { const base = 500 + n*60; [0,1,2].forEach(i=>setTimeout(()=>beep(base+i*90,.09,"triangle",.1), i*45)); }
function sfxCombo(n) { beep(300+n*120, .18, "square", .08); }
function sfxBomb() { beep(120, .3, "sawtooth", .15); setTimeout(()=>beep(90,.25,"sawtooth",.12),80); }
function sfxWin() { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,"triangle",.12),i*110)); }
function sfxLose() { [400,320,260,180].forEach((f,i)=>setTimeout(()=>beep(f,.2,"sine",.1),i*130)); }
function randType() { return Math.floor(Math.random() * TYPES); }
function initBoard() { board = []; sp = []; for (let r = 0; r < ROWS; r++) { board[r] = []; sp[r] = []; for (let c = 0; c < COLS; c++) { let t; do { t = randType(); } while ((c >= 2 && board[r][c-1] === t && board[r][c-2] === t) || (r >= 2 && board[r-1][c] === t && board[r-2][c] === t)); board[r][c] = t; sp[r][c] = null; } } }
function inBounds(r,c){ return r>=0 && r<ROWS && c>=0 && c<COLS; }
function findMatches() { const cells = new Set(); const groups = []; for (let r = 0; r < ROWS; r++) { let c = 0; while (c < COLS) { const t = board[r][c]; if (t === -1) { c++; continue; } let len = 1; while (c+len < COLS && board[r][c+len] === t) len++; if (len >= 3) { const gc = []; for (let k=0;k<len;k++) { cells.add(r+","+(c+k)); gc.push([r, c+k]); } groups.push({cells: gc, len, dir: "h"}); } c += len; } } for (let c = 0; c < COLS; c++) { let r = 0; while (r < ROWS) { const t = board[r][c]; if (t === -1) { r++; continue; } let len = 1; while (r+len < ROWS && board[r+len][c] === t) len++; if (len >= 3) { const gc = []; for (let k=0;k<len;k++) { cells.add((r+k)+","+c); gc.push([r+k, c]); } groups.push({cells: gc, len, dir: "v"}); } r += len; } } return { cells, groups }; }
function applyGravity() { for (let c = 0; c < COLS; c++) { let write = ROWS - 1; for (let r = ROWS - 1; r >= 0; r--) { if (board[r][c] !== -1) { if (write !== r) { board[write][c] = board[r][c]; sp[write][c] = sp[r][c]; board[r][c] = -1; sp[r][c] = null; } write--; } } for (let r = write; r >= 0; r--) { board[r][c] = randType(); sp[r][c] = null; } } }
function hasAnyMove() { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { for (const [dr,dc] of [[0,1],[1,0]]) { const r2=r+dr, c2=c+dc; if (!inBounds(r2,c2)) continue; swap(r,c,r2,c2); const has = findMatches().cells.size > 0; swap(r,c,r2,c2); if (has) return true; } } return false; }
function swap(r,c,r2,c2){ const t=board[r][c]; board[r][c]=board[r2][c2]; board[r2][c2]=t; const s=sp[r][c]; sp[r][c]=sp[r2][c2]; sp[r2][c2]=s; }
function px(r,c){ return { x: c*STEP, y: r*STEP }; }
function renderAll() { selected = null; dragState = null; boardEl.querySelectorAll(".tile").forEach(el=>el.remove()); for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { createTile(r, c, board[r][c], true); } }
function badgeFor(s) { if (s === "row") return "↔"; if (s === "col") return "↕"; if (s === "bomb") return "💥"; return ""; }
function createTile(r, c, type, instant) { const el = document.createElement("div"); const s = sp[r][c]; el.className = "tile" + (s ? " sp-" + s : ""); el.dataset.r = r; el.dataset.c = c; const p = px(r,c); el.style.setProperty("--tx", p.x + "px"); el.style.setProperty("--ty", p.y + "px"); if (instant) { el.style.transition = "none"; requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.transition="")); } const badge = badgeFor(s); el.innerHTML = `<img class="gem" src="${CANDIES[type]}" alt="">` + (badge ? `<div class="sp-badge">${badge}</div>` : ""); el.addEventListener("pointerdown", (e) => onTilePointerDown(e, Number(el.dataset.r), Number(el.dataset.c))); boardEl.appendChild(el); return el; }
function refreshTileSp(r, c) { const el = tileAt(r, c); if (!el) return; const s = sp[r][c]; el.className = "tile" + (s ? " sp-" + s : ""); const old = el.querySelector(".sp-badge"); if (old) old.remove(); const badge = badgeFor(s); if (badge) { const b = document.createElement("div"); b.className = "sp-badge"; b.textContent = badge; el.appendChild(b); } }
function moveTileTo(el, r, c) { el.dataset.r = r; el.dataset.c = c; const p = px(r,c); el.style.setProperty("--tx", p.x + "px"); el.style.setProperty("--ty", p.y + "px"); }
function tileAt(r,c){ return boardEl.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`); }
function onTilePointerDown(e, r, c) { if (busy || gameEnded) return; const el = tileAt(r, c); if (!el) return; if (dragState) { dragState.el.classList.remove("pressed"); dragState = null; } dragState = { startR:r, startC:c, startX:e.clientX, startY:e.clientY, consumed:false, el:el }; el.classList.add("pressed"); try { el.setPointerCapture(e.pointerId); } catch(_) {} }
function onBoardPointerMove(e) { if (!dragState || dragState.consumed || busy) return; const dx = e.clientX - dragState.startX; const dy = e.clientY - dragState.startY; if (Math.max(Math.abs(dx), Math.abs(dy)) < DRAG_THRESHOLD) return; let dr = 0, dc = 0; if (Math.abs(dx) >= Math.abs(dy)) dc = dx > 0 ? 1 : -1; else dr = dy > 0 ? 1 : -1; const tr = dragState.startR + dr, tc = dragState.startC + dc; if (!inBounds(tr, tc)) return; const d = dragState; d.consumed = true; d.el.classList.remove("pressed"); if (selected) { const s = tileAt(selected.r, selected.c); if (s) s.classList.remove("selected"); selected = null; } clearHint(); trySwap(d.startR, d.startC, tr, tc); dragState = null; }
function onBoardPointerUp() { if (!dragState) return; const d = dragState; dragState = null; d.el.classList.remove("pressed"); if (d.consumed) return; onTileClick(Number(d.el.dataset.r), Number(d.el.dataset.c)); }
function onBoardPointerCancel() { if (dragState) { dragState.el.classList.remove("pressed"); dragState = null; } }
function onTileClick(r, c) { if (busy || gameEnded) return; const el = tileAt(r, c); if (!el) return; if (!selected) { selected = {r,c}; el.classList.add("selected"); sfxSelect(); return; } const s = selected; if (s.r === r && s.c === c) { el.classList.remove("selected"); selected = null; return; } const adj = Math.abs(s.r-r) + Math.abs(s.c-c) === 1; if (!adj) { const selEl = tileAt(s.r, s.c); if (selEl) selEl.classList.remove("selected"); selected = {r,c}; el.classList.add("selected"); sfxSelect(); return; } const selEl = tileAt(s.r, s.c); if (selEl) selEl.classList.remove("selected"); selected = null; trySwap(s.r, s.c, r, c); }
function expandSpecial(initialSet) { const result = new Set(initialSet); const queue = [...initialSet]; while (queue.length) { const k = queue.shift(); const [r,c] = k.split(",").map(Number); const s = sp[r] ? sp[r][c] : null; if (!s) continue; let add = []; if (s === "row") { for (let cc=0; cc<COLS; cc++) add.push([r,cc]); } else if (s === "col") { for (let rr=0; rr<ROWS; rr++) add.push([rr,c]); } else if (s === "bomb") { for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) { if (inBounds(r+dr, c+dc)) add.push([r+dr, c+dc]); } } add.forEach(([rr,cc]) => { const kk = rr+","+cc; if (!result.has(kk)) { result.add(kk); queue.push(kk); } }); } return result; }
async function trySwap(r1,c1,r2,c2) { busy = true; const a = tileAt(r1,c1), b = tileAt(r2,c2); if (!a || !b) { busy = false; return; } swapPositions = [[r1,c1],[r2,c2]]; swap(r1,c1,r2,c2); moveTileTo(a, r2, c2); moveTileTo(b, r1, c1); await wait(200); if (findMatches().cells.size === 0) { sfxBad(); swap(r1,c1,r2,c2); moveTileTo(a, r1, c1); moveTileTo(b, r2, c2); await wait(200); busy = false; return; } sfxSwap(); movesLeft--; updateHud(); await resolveBoard(0); busy = false; if (!gameEnded) checkGameState(); }
async function resolveBoard(combo) { const matchInfo = findMatches(); if (matchInfo.cells.size === 0) { if (!hasAnyMove()) { await reshuffle(); if (findMatches().cells.size > 0) await resolveBoard(0); } return; } const cellDirs = {}; matchInfo.groups.forEach(g => { g.cells.forEach(([r,c]) => { const k = r+","+c; if (!cellDirs[k]) cellDirs[k] = new Set(); cellDirs[k].add(g.dir); }); }); const toCreate = {}; Object.keys(cellDirs).forEach(k => { if (cellDirs[k].size >= 2) toCreate[k] = "bomb"; }); matchInfo.groups.forEach(g => { if (g.len < 4) return; let pick = null; for (const [r,c] of g.cells) { const k = r+","+c; if (toCreate[k]) continue; if (swapPositions.some(([sr,sc]) => sr===r && sc===c)) { pick = k; break; } } if (!pick) { const mid = g.cells[Math.floor(g.cells.length/2)]; pick = mid[0]+","+mid[1]; } if (!toCreate[pick]) { if (g.len >= 5) toCreate[pick] = "bomb"; else if (g.dir === "h") toCreate[pick] = "col"; else toCreate[pick] = "row"; } }); const toClear = new Set(); matchInfo.cells.forEach(k => { if (!toCreate[k]) toClear.add(k); }); const finalClear = expandSpecial(toClear); combo++; const n = finalClear.size; const points = n * 10 * combo; score += points; const rect = boardEl.getBoundingClientRect(); const cx = rect.left + rect.width/2, cy = rect.top + rect.height/3; showScorePop(points, cx, cy, combo); if (combo >= 2) showCombo(combo); sfxMatch(combo); if (combo >= 2) sfxCombo(combo); Object.keys(toCreate).forEach(k => { const [r,c] = k.split(",").map(Number); sp[r][c] = toCreate[k]; refreshTileSp(r, c); }); const els = []; finalClear.forEach(key => { const [r,c] = key.split(",").map(Number); const el = tileAt(r,c); if (el) { if (sp[r][c] === "bomb") sfxBomb(); el.classList.add("pop"); els.push(el); } }); finalClear.forEach(key => { const [r,c] = key.split(",").map(Number); board[r][c] = -1; sp[r][c] = null; }); await wait(320); els.forEach(el=>el.remove()); applyGravity(); for (let c = 0; c < COLS; c++) { const colTiles = []; for (let r = ROWS - 1; r >= 0; r--) { const el = tileAt(r, c); if (el) colTiles.push(el); } let targetRow = ROWS - 1; for (const el of colTiles) { moveTileTo(el, targetRow, c); targetRow--; } for (let r = targetRow; r >= 0; r--) { const type = board[r][c]; const nEl = createTile(r, c, type, false); nEl.style.transition = "none"; const above = px(r - ROWS - 2, c); nEl.style.setProperty("--tx", above.x + "px"); nEl.style.setProperty("--ty", above.y + "px"); void nEl.offsetWidth; nEl.style.transition = "transform .3s ease"; moveTileTo(nEl, r, c); } } updateHud(); await wait(330); await resolveBoard(combo); }
async function reshuffle() { let guard = 0; do { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { board[r][c] = randType(); sp[r][c] = null; } guard++; } while ((findMatches().cells.size > 0 || !hasAnyMove()) && guard < 100); renderAll(); await wait(120); }
function wait(ms){ return new Promise(res=>setTimeout(res, ms)); }
function showScorePop(points, x, y, combo) { const el = document.createElement("div"); el.className = "score-pop"; el.textContent = "+" + points; el.style.left = (x - 30 + (Math.random()*40-20)) + "px"; el.style.top = (y + (Math.random()*20-10)) + "px"; if (combo >= 2) { el.style.fontSize = "34px"; el.textContent = "+" + points + " 连击×" + combo; } document.body.appendChild(el); setTimeout(()=>el.remove(), 950); }
function showCombo(n) { const names = ["", "", "连击 x2！", "三重连击 x3！", "超级连击 x4！", "逆天连击 x5！", "传说连击 x6！"]; const el = document.createElement("div"); el.className = "combo-banner"; el.textContent = names[Math.min(n, names.length-1)] + (n >= 3 ? " 🔥" : ""); document.body.appendChild(el); setTimeout(()=>el.remove(), 1100); }
function confetti() { const colors = ["#ff5d7e","#ffd34d","#7ed957","#5fb8ff","#b26bff","#ff9a3d","#fff"]; for (let i = 0; i < 80; i++) { const c = document.createElement("div"); c.className = "confetti"; c.style.left = Math.random()*100 + "vw"; c.style.background = colors[Math.floor(Math.random()*colors.length)]; c.style.transform = `rotate(${Math.random()*360}deg)`; c.style.animationDuration = (2 + Math.random()*2) + "s"; c.style.animationDelay = (Math.random()*0.8) + "s"; c.style.width = (6 + Math.random()*8) + "px"; c.style.height = (8 + Math.random()*10) + "px"; document.body.appendChild(c); setTimeout(()=>c.remove(), 5200); } }
function updateHud() { const lv = LEVELS[currentLevel]; scoreEl.textContent = score; movesEl.textContent = movesLeft; targetEl.textContent = lv.target; levelTagEl.textContent = "第 " + (currentLevel + 1) + "/" + LEVELS.length + " 关"; scoreEl.style.color = score >= lv.target ? "#7dffa8" : "#fff"; }
function calcStars() { const lv = LEVELS[currentLevel]; if (movesLeft >= Math.ceil(lv.moves * 0.25)) return 3; if (movesLeft > 0) return 2; return 1; }
function checkGameState() { if (gameEnded) return; const lv = LEVELS[currentLevel]; if (score >= lv.target) { gameEnded = true; const st = calcStars(); levelStars[currentLevel] = Math.max(levelStars[currentLevel], st); if (currentLevel + 1 < LEVELS.length) unlockedLevels = Math.max(unlockedLevels, currentLevel + 2); saveProgress(); sfxWin(); confetti(); showResult(true); } else if (movesLeft <= 0) { gameEnded = true; sfxLose(); showResult(false); } }
function showResult(win) { const overlay = document.getElementById("resultOverlay"); const lv = LEVELS[currentLevel]; const btn = document.getElementById("againBtn"); const title = document.getElementById("resultTitle"); const starsEl = document.getElementById("stars"); const resultScore = document.getElementById("resultScore"); const msg = document.getElementById("resultMsg"); if (win) { const st = calcStars(); title.textContent = "🎉 通关成功！"; starsEl.textContent = "★".repeat(st) + "☆".repeat(3 - st); resultScore.textContent = "得分 " + score + " / 目标 " + lv.target; msg.textContent = "剩余 " + movesLeft + " 步，太棒了！"; if (currentLevel + 1 < LEVELS.length) { btn.textContent = "▶ 下一关"; btn.onclick = () => startLevel(currentLevel + 1); } else { btn.textContent = "🎊 全部通关！再来一次"; btn.onclick = () => startLevel(0); } } else { title.textContent = "😢 步数用完了"; starsEl.textContent = "💪"; resultScore.textContent = "得分 " + score + " / 目标 " + lv.target; msg.textContent = "差一点点，再试一次吧！"; btn.textContent = "🔁 再试一次"; btn.onclick = () => startLevel(currentLevel); } overlay.classList.remove("hidden"); }
function findHint() { for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { for (const [dr,dc] of [[0,1],[1,0]]) { const r2=r+dr, c2=c+dc; if (!inBounds(r2,c2)) continue; swap(r,c,r2,c2); const has = findMatches().cells.size > 0; swap(r,c,r2,c2); if (has) return [r,c,r2,c2]; } } return null; }
function showHint() { if (busy || gameEnded) return; clearHint(); const h = findHint(); if (!h) { showScorePop(0, innerWidth/2, innerHeight/3, 0); return; } const [r1,c1,r2,c2] = h; [tileAt(r1,c1), tileAt(r2,c2)].forEach(el=>el && el.classList.add("hint")); hintTimer = setTimeout(clearHint, 1500); }
function clearHint(){ boardEl.querySelectorAll(".hint").forEach(el=>el.classList.remove("hint")); clearTimeout(hintTimer); }
function loadProgress() { try { const d = JSON.parse(localStorage.getItem("xiaoxiaole_progress")); if (d && Array.isArray(d.stars)) { unlockedLevels = d.unlocked || 1; levelStars = d.stars.slice(0, LEVELS.length); while (levelStars.length < LEVELS.length) levelStars.push(0); } } catch(e) {} }
function saveProgress() { try { localStorage.setItem("xiaoxiaole_progress", JSON.stringify({ unlocked: unlockedLevels, stars: levelStars })); } catch(e) {} }
function renderLevelList() { levelListEl.innerHTML = ""; LEVELS.forEach((lv, i) => { const unlocked = i < unlockedLevels; const card = document.createElement("div"); card.className = "level-card" + (unlocked ? "" : " locked"); card.innerHTML = "<div><div class=\"lv-name\">" + (unlocked ? "第 " + (i+1) + " 关" : "🔒") + "</div><div class=\"lv-info\">目标 " + lv.target + " 分 · " + lv.moves + " 步 · " + lv.types + " 种小伙伴</div></div><div class=\"lv-stars\">" + (unlocked ? "★".repeat(levelStars[i]) + "☆".repeat(3 - levelStars[i]) : "") + "</div><div class=\"play\">" + (unlocked ? "▶" : "") + "</div>"; card.addEventListener("click", () => { if (unlocked) startLevel(i); }); levelListEl.appendChild(card); }); }
function startLevel(idx) { currentLevel = idx; const lv = LEVELS[idx]; TYPES = lv.types; score = 0; movesLeft = lv.moves; gameEnded = false; busy = false; selected = null; dragState = null; swapPositions = []; initBoard(); renderAll(); updateHud(); document.getElementById("startOverlay").classList.add("hidden"); document.getElementById("resultOverlay").classList.add("hidden"); }
function showLevelSelect() { renderLevelList(); document.getElementById("startOverlay").classList.remove("hidden"); document.getElementById("resultOverlay").classList.add("hidden"); }
document.getElementById("restartBtn").addEventListener("click", () => startLevel(currentLevel));
document.getElementById("hintBtn").addEventListener("click", showHint);
document.getElementById("levelBtn").addEventListener("click", showLevelSelect);
document.getElementById("startBtn").addEventListener("click", () => startLevel(0));
document.addEventListener("pointermove", onBoardPointerMove);
document.addEventListener("pointerup", onBoardPointerUp);
document.addEventListener("pointercancel", onBoardPointerCancel);
for (let i = 0; i < ROWS*COLS; i++) cellGridEl.appendChild(document.createElement("i"));
fitBoard(); loadProgress(); initBoard(); renderAll(); updateHud(); renderLevelList();
</script>
