<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache">
<title>咩了个咩 · Mie Le Ge Mie</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{overflow-x:hidden;}
body{
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:linear-gradient(160deg,#5b2a86 0%,#a2379c 55%,#e2588b 100%);
  color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:8px;user-select:none;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.15) 0,transparent 50px),
             radial-gradient(circle at 85% 15%,rgba(255,255,255,.12) 0,transparent 60px);}
.wrap{position:relative;z-index:1;width:100%;max-width:480px;}
h1{text-align:center;font-size:26px;font-weight:900;letter-spacing:3px;
  text-shadow:0 3px 8px rgba(0,0,0,.35);margin:6px 0;}
.sub{text-align:center;font-size:12px;opacity:.85;margin-bottom:8px;}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;}
.top .lv{background:rgba(255,255,255,.15);padding:4px 12px;border-radius:10px;}
.props{display:flex;gap:8px;}
.prop{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  border-radius:10px;padding:4px 10px;cursor:pointer;font-size:12px;}
.prop.used{opacity:.4;pointer-events:none;}

/* 缩放容器：内部固定440px坐标，外部按屏幕等比缩小 */
#stackWrap{position:relative;width:440px;margin:0 auto;}
#stack{position:relative;width:440px;height:440px;}
.tile{position:absolute;width:52px;height:52px;border-radius:10px;
  background:#fff;border:2px solid #ddd;box-shadow:0 3px 8px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .1s, box-shadow .1s;}
.tile img{width:90%;height:90%;object-fit:contain;pointer-events:none;}
.tile.locked{filter:brightness(.75);cursor:not-allowed;}
.tile:not(.locked):active{transform:scale(.92);}

/* 卡槽区域也缩放 */
#slotWrap{width:440px;margin:0 auto;}
#tempSlot{display:flex;justify-content:center;gap:4px;margin:4px auto;
  background:rgba(0,0,0,.15);padding:6px;border-radius:12px;min-height:56px;}
#slot{display:flex;justify-content:center;gap:4px;margin:6px auto;
  background:rgba(0,0,0,.2);padding:8px;border-radius:12px;min-height:60px;}
.slot-cell{width:52px;height:52px;border-radius:10px;position:relative;}
.slot-cell img{width:100%;height:100%;object-fit:contain;}
.slot-cell.enter{animation:enterPop .25s ease;}
@keyframes enterPop{0%{transform:scale(.3);opacity:0;}100%{transform:scale(1);opacity:1;}}
.slot-cell.matched img{animation:popOut .35s ease forwards;}
@keyframes popOut{0%{transform:scale(1);opacity:1;}50%{transform:scale(1.2);opacity:1;}100%{transform:scale(0);opacity:0;}}
.temp-cell{width:52px;height:52px;border-radius:10px;cursor:pointer;position:relative;}
.temp-cell img{width:100%;height:100%;object-fit:contain;}
.temp-cell:not(:empty){background:rgba(255,255,255,.1);border:1px dashed rgba(255,255,255,.3);}
.btn{background:linear-gradient(180deg,#ffd166,#ff9f43);border:none;color:#6b3b00;
  font-weight:800;padding:10px 20px;border-radius:12px;cursor:pointer;font-size:15px;
  box-shadow:0 4px 0 #d17f2a;}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d17f2a;}
.overlay{position:fixed;inset:0;background:rgba(30,8,50,.8);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;z-index:100;}
.overlay.hidden{display:none;}
.panel{background:linear-gradient(180deg,#7b2f9e,#5b1f7d);border:2px solid rgba(255,255,255,.4);
  border-radius:24px;padding:28px;text-align:center;max-width:360px;width:90%;}
.panel h2{font-size:28px;margin-bottom:10px;}
.panel .big{font-size:18px;margin:10px 0;}
.panel .btn{display:block;width:100%;margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐑 咩了个咩</h1>
  <div class="sub">将三个一样的小伙伴放进下方卡槽即可消除，7 格满即败</div>
  <div class="top">
    <div class="lv" id="lvLabel">第 1 关</div>
    <div class="props">
      <div class="prop" id="pUndo">↩️ 撤回</div>
      <div class="prop" id="pShuffle">🔀 洗牌</div>
      <div class="prop" id="pOut">📤 移出</div>
    </div>
  </div>
  <div id="stackWrap"><div id="stack"></div></div>
  <div id="slotWrap">
    <div id="tempSlot"></div>
    <div id="slot"></div>
  </div>
  <div style="text-align:center;">
    <button class="btn" id="restartBtn">🔄 重开</button>
  </div>
</div>

<div class="overlay hidden" id="resultOv">
  <div class="panel">
    <h2 id="rt">🎉 通关！</h2>
    <div class="big" id="rs"></div>
    <button class="btn" id="nextBtn">下一关</button>
    <button class="btn" id="retryBtn">再来一次</button>
  </div>
</div>

const LEVELS = [
  { types: 3, groups: 3 },
  { types: 8, groups: 9 },
];
let level = 0, tiles = [], slot = [], tempSlot = [], history = [], props = {undo:1, shuffle:1, out:1};
const stackEl = document.getElementById("stack");
const slotEl = document.getElementById("slot");
const tempEl = document.getElementById("tempSlot");

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* 等比缩放适配手机 */
function fitScale(){
  const avail = Math.min(440, window.innerWidth - 16);
  const s = avail / 440;
  document.getElementById("stack").style.zoom = s;
  document.getElementById("slotWrap").style.zoom = s;
}

function build(){
  let tries = 0;
  do { buildBoard(); tries++; } while (!isSolvable() && tries < 100);
  render();
  fitScale();
}

function buildBoard(){
  tiles = []; slot = []; tempSlot = []; history = [];
  props = {undo:1, shuffle:1, out:1};
  document.getElementById("lvLabel").textContent = "第 " + (level+1) + " 关";
  ["pUndo","pShuffle","pOut"].forEach(id=>{document.getElementById(id).classList.remove("used");});
  const lv = LEVELS[level];
  const deck = [];
  for (let t=0; t<lv.types; t++){ for (let g=0; g<lv.groups; g++) deck.push(t); }
  shuffle(deck);
  const cx0 = 220; // stack固定440宽
  const tileSize = 52;
  let idx = 0;
  const total = deck.length;

  if (level === 0){
    const bottomY = 200, gap = 58;
    for (let k=0; k<6; k++){
      const x = cx0 + (k - 2.5) * gap - tileSize/2;
      tiles.push({ id: idx, type: deck[idx], layer: 0, x, y: bottomY, removed: false });
      idx++;
    }
    for (let k=0; k<3; k++){
      const x = cx0 + (k - 1) * gap - tileSize/2;
      tiles.push({ id: idx, type: deck[idx], layer: 1, x, y: bottomY - 20, removed: false });
      idx++;
    }
  } else {
    const pileCount = 3;
    const pileLeftX = 5, pileRightX = 440 - 5 - tileSize, pileY = 130;
    for (let s=0; s<2; s++){
      const px = s===0 ? pileLeftX : pileRightX;
      for (let n=0; n<pileCount; n++){
        tiles.push({ id: idx, type: deck[idx], layer: 20+n, x: px, y: pileY+n*2, removed: false });
        idx++;
      }
    }
    const mk = (dx, y, layer) => ({id: idx, type: deck[idx], layer, x: cx0+dx-tileSize/2, y, removed:false});
    const L5 = [[-56,130,5],[0,130,5],[56,130,5]];
    const L4 = [[-84,156,4],[-28,156,4],[28,156,4],[84,156,4]];
    const L3 = [[-112,182,3],[-56,182,3],[0,182,3],[56,182,3],[112,182,3]];
    const L2 = [[-140,208,2],[-84,208,2],[-28,208,2],[28,208,2],[84,208,2],[140,208,2]];
    const L1 = [[-168,234,1],[-112,234,1],[-56,234,1],[0,234,1],[56,234,1],[112,234,1],[168,234,1]];
    const L0 = [[-196,260,0],[-140,260,0],[-84,260,0],[-28,260,0],[28,260,0],[84,260,0],[140,260,0],[196,260,0]];
    const L2b = [[-140,313,2],[-84,313,2],[-28,313,2],[28,313,2],[84,313,2],[140,313,2]];
    const L1b = [[-168,339,1],[-112,339,1],[-56,339,1],[0,339,1],[56,339,1],[112,339,1],[168,339,1]];
    const L0b = [[-196,365,0],[-140,365,0],[-84,365,0],[-28,365,0],[28,365,0],[84,365,0],[140,365,0],[196,365,0]];
    for (const [dx,y,l] of L5){ tiles.push(mk(dx,y,l)); idx++; }
    for (const [dx,y,l] of L4){ tiles.push(mk(dx,y,l)); idx++; }
    for (const [dx,y,l] of L3){ tiles.push(mk(dx,y,l)); idx++; }
    for (const [dx,y,l] of L2){ tiles.push(mk(dx,y,l)); idx++; }
    for (const [dx,y,l] of L1){ tiles.push(mk(dx,y,l)); idx++; }
    for (const [dx,y,l] of L0){ tiles.push(mk(dx,y,l)); idx++; }
    for (const [dx,y,l] of L2b){ tiles.push(mk(dx,y,l)); idx++; }
    for (const [dx,y,l] of L1b){ tiles.push(mk(dx,y,l)); idx++; }
    for (const [dx,y,l] of L0b){ tiles.push(mk(dx,y,l)); idx++; }
    while (idx < total){
      const side = Math.random() < 0.5 ? 0 : 1;
      const px = side===0 ? pileLeftX : pileRightX;
      tiles.push({id: idx, type: deck[idx], layer: 30+idx, x: px, y: pileY+Math.random()*16, removed: false});
      idx++;
    }
  }
}

function isSolvable(){
  const removed = tiles.map(()=>false);
  let slotArr = [];
  for (let step=0; step<600; step++){
    const count = {};
    slotArr.forEach(t => count[t]=(count[t]||0)+1);
    const clickable = [];
    for (let i=0;i<tiles.length;i++){
      if (removed[i]) continue;
      const t = tiles[i];
      let ok = true;
      for (let j=0;j<tiles.length;j++){
        if (removed[j] || j===i || tiles[j].layer <= t.layer) continue;
        if (Math.abs(tiles[j].x-t.x)<53 && Math.abs(tiles[j].y-t.y)<53){ ok=false; break; }
      }
      if (ok) clickable.push(i);
    }
    if (clickable.length===0) break;
    let pick = -1;
    for (const i of clickable){ if (count[tiles[i].type]===2){ pick=i; break; } }
    if (pick<0) for (const i of clickable){ if (count[tiles[i].type]===1){ pick=i; break; } }
    if (pick<0) pick = clickable[0];
    removed[pick] = true;
    slotArr.push(tiles[pick].type);
    let changed = true;
    while (changed){
      changed = false;
      const cnt = {};
      slotArr.forEach(x => cnt[x]=(cnt[x]||0)+1);
      for (const k of Object.keys(cnt)){
        if (cnt[k] >= 3){
          let rem = 0;
          for (let i=slotArr.length-1; i>=0 && rem<3; i--){
            if (slotArr[i]==k){ slotArr.splice(i,1); rem++; }
          }
          changed = true; break;
        }
      }
    }
    if (slotArr.length >= 7) return false;
  }
  return removed.every(r=>r);
}

function isUncovered(t){
  const S = 53;
  for (const o of tiles){
    if (o.removed || o.layer <= t.layer) continue;
    if (Math.abs(o.x - t.x) < S && Math.abs(o.y - t.y) < S) return false;
  }
  return true;
}

function render(){
  stackEl.innerHTML = "";
  tiles.forEach(t=>{
    if (t.removed) return;
    const el = document.createElement("div");
    el.className = "tile" + (isUncovered(t) ? "" : " locked");
    el.style.left = t.x + "px";
    el.style.top = t.y + "px";
    el.style.zIndex = t.layer*250 + Math.round(t.y);
    el.innerHTML = `<img src="${IMG[t.type]}" alt="">`;
    el.onclick = ()=>onTile(t);
    stackEl.appendChild(el);
  });
  renderSlot();
  renderTemp();
}

function renderSlot(enterIdx=-1){
  slotEl.innerHTML = "";
  for (let i=0;i<7;i++){
    const c = document.createElement("div");
    c.className = "slot-cell" + (i===enterIdx ? " enter" : "");
    if (slot[i] !== undefined){
      const img = document.createElement("img");
      img.src = IMG[slot[i]];
      c.appendChild(img);
    }
    slotEl.appendChild(c);
  }
}

function renderTemp(){
  tempEl.innerHTML = "";
  for (let i=0;i<3;i++){
    const c = document.createElement("div");
    c.className = "temp-cell";
    if (tempSlot[i] !== undefined){
      const img = document.createElement("img");
      img.src = IMG[tempSlot[i]];
      c.appendChild(img);
      c.onclick = ()=>{
        if (slot.length >= 7) return;
        const t = tempSlot.splice(i,1)[0];
        slot.push(t);
        afterSlotChange();
      };
    }
    tempEl.appendChild(c);
  }
}

function afterSlotChange(){
  const count = {};
  slot.forEach(x => count[x]=(count[x]||0)+1);
  const matchedType = Object.keys(count).find(k => count[k]>=3);
  renderSlot(slot.length-1);
  if (matchedType !== undefined){
    setTimeout(()=>{
      const cells = slotEl.querySelectorAll(".slot-cell");
      let n = 0;
      for (let i=0; i<slot.length && n<3; i++){
        if (String(slot[i]) === matchedType && cells[i]){
          cells[i].classList.add("matched");
          n++;
        }
      }
    }, 50);
    setTimeout(()=>{
      let removedCount = 0;
      for (let i=slot.length-1; i>=0 && removedCount<3; i--){
        if (String(slot[i]) === matchedType){ slot.splice(i,1); removedCount++; }
      }
      render();
      checkEnd();
    }, 450);
  } else {
    checkEnd();
  }
}

function onTile(t){
  if (!isUncovered(t) || slot.length >= 7) return;
  t.removed = true;
  history.push({type:t.type, id:t.id});
  slot.push(t.type);
  render();
  afterSlotChange();
}

function checkEnd(){
  if (slot.length >= 7){
    setTimeout(()=>showResult(false,"槽位满了！"), 300);
    return;
  }
  if (tiles.every(t=>t.removed)){
    setTimeout(()=>showResult(true,"通关！"), 300);
  }
}

function showResult(win, msg){
  document.getElementById("rt").textContent = win ? "🎉 通关！" : "😢 失败";
  document.getElementById("rs").textContent = msg;
  document.getElementById("resultOv").classList.remove("hidden");
  document.getElementById("nextBtn").style.display = win && level+1 < LEVELS.length ? "block" : "none";
}

document.getElementById("pUndo").onclick = ()=>{
  if (props.undo<=0 || !history.length) return;
  const h = history.pop();
  const t = tiles.find(x=>x.id===h.id);
  if (t) t.removed = false;
  for (let i=slot.length-1;i>=0;i--){ if (slot[i]===h.type){ slot.splice(i,1); break; } }
  props.undo--;
  document.getElementById("pUndo").classList.add("used");
  render();
};
document.getElementById("pShuffle").onclick = ()=>{
  if (props.shuffle<=0) return;
  const active = tiles.filter(t=>!t.removed);
  const types = active.map(t=>t.type);
  shuffle(types);
  active.forEach((t,i)=>t.type=types[i]);
  props.shuffle--;
  document.getElementById("pShuffle").classList.add("used");
  render();
};
document.getElementById("pOut").onclick = ()=>{
  if (props.out<=0 || tempSlot.length >= 3) return;
  const n = Math.min(3 - tempSlot.length, slot.length);
  const out = slot.splice(-n, n);
  out.forEach(t=>tempSlot.push(t));
  props.out--;
  document.getElementById("pOut").classList.add("used");
  render();
};
document.getElementById("restartBtn").onclick = ()=>build();
document.getElementById("retryBtn").onclick = ()=>{document.getElementById("resultOv").classList.add("hidden");build();};
document.getElementById("nextBtn").onclick = ()=>{level++;document.getElementById("resultOv").classList.add("hidden");build();};

window.addEventListener("resize", fitScale);
window.addEventListener("orientationchange", ()=>setTimeout(fitScale, 100));
build();
</script>
