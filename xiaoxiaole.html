<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>糖果消消乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #2b1055 0%, #7597de 50%, #ff8fbc 100%);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px; overflow-x: hidden;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .game-wrap { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .header { width: 100%; text-align: center; }
  .title { font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.35); letter-spacing: 2px; }
  .subtitle { font-size: 13px; color: rgba(255,255,255,.85); margin-top: 2px; }
  .hud {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,.18); border-radius: 14px; padding: 8px 14px;
    color: #fff; font-size: 14px; font-weight: 700; backdrop-filter: blur(6px);
  }
  .hud .score span { font-size: 18px; }
  .hud .moves span { font-size: 18px; }
  .progress-bar { width: 100%; height: 8px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
  .progress-bar .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffd86f, #ff9a3d); border-radius: 4px; transition: width .4s ease; }
  .board-container {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    background: rgba(0,0,0,.22); border-radius: 16px; padding: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,.35);
  }
  .board { position: relative; width: 100%; height: 100%; touch-action: none; }
  .tile {
    position: absolute; width: 12.5%; height: 12.5%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0; cursor: pointer; touch-action: none;
    transform: translate(var(--tx, 0px), var(--ty, 0px));
    transition: transform .22s cubic-bezier(.2,.8,.3,1.15);
  }
  .tile .candy {
    width: 86%; height: 86%; display: flex; align-items: center; justify-content: center;
    font-size: 30px; border-radius: 14px;
    background: rgba(255,255,255,.92);
    box-shadow: inset 0 -4px 8px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.18);
    transition: transform .15s ease, background .15s ease;
  }
  .tile.selected { z-index: 3; }
  .tile.selected .candy {
    transform: translate(var(--tx,0px), var(--ty,0px)) scale(1.18);
    background: #ffe08a; box-shadow: 0 0 0 3px #ff9a3d, 0 4px 12px rgba(255,154,61,.5);
  }
  .tile.swap .candy {
    animation: swapAnim .3s ease;
  }
  .tile.pop .candy {
    animation: popAnim .4s ease forwards;
  }
  .tile.hint { z-index: 2; }
  .tile.hint .candy {
    animation: hintAnim 1s ease infinite;
  }
  @keyframes swapAnim {
    0% { transform: translate(var(--tx,0px), var(--ty,0px)) scale(.9); }
    100% { transform: translate(var(--tx,0px), var(--ty,0px)) scale(1); }
  }
  @keyframes popAnim {
    0% { transform: translate(var(--tx,0px), var(--ty,0px)) scale(1); opacity: 1; }
    50% { transform: translate(var(--tx,0px), var(--ty,0px)) scale(1.3); opacity: 1; }
    100% { transform: translate(var(--tx,0px), var(--ty,0px)) scale(0); opacity: 0; }
  }
  @keyframes hintAnim {
    0%, 100% { transform: translate(var(--tx,0px), var(--ty,0px)) scale(1); }
    50% { transform: translate(var(--tx,0px), var(--ty,0px)) scale(1.12); }
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(20,10,40,.72);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .overlay.show { display: flex; }
  .panel {
    width: 100%; max-width: 360px; background: linear-gradient(160deg, #fff 0%, #ffe9f2 100%);
    border-radius: 22px; padding: 26px 22px; text-align: center;
    box-shadow: 0 16px 48px rgba(0,0,0,.4);
  }
  .panel h2 { font-size: 26px; color: #d6336c; margin-bottom: 6px; }
  .panel p { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
  .btn {
    display: inline-block; border: none; border-radius: 12px; padding: 12px 26px;
    font-size: 16px; font-weight: 800; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #ff6b9d, #ff2e63);
    box-shadow: 0 6px 16px rgba(255,46,99,.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:active { transform: scale(.94); }
  .btn.secondary { background: linear-gradient(135deg, #7f8cff, #5c6bc0); box-shadow: 0 6px 16px rgba(92,107,192,.35); }
  .btn.small { padding: 8px 16px; font-size: 13px; }
  .stars { font-size: 40px; letter-spacing: 6px; margin: 8px 0; }
  .stars .off { filter: grayscale(1); opacity: .35; }
  .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
  .level-card {
    background: #fff; border: 2px solid #eee; border-radius: 14px; padding: 12px 6px;
    cursor: pointer; transition: transform .12s ease, border-color .12s ease;
  }
  .level-card:active { transform: scale(.95); }
  .level-card.locked { opacity: .45; cursor: not-allowed; }
  .level-card .lc-name { font-size: 13px; font-weight: 800; color: #333; }
  .level-card .lc-meta { font-size: 11px; color: #999; margin-top: 4px; }
  .level-card .lc-stars { font-size: 14px; letter-spacing: 2px; margin-top: 4px; }
  .tip { font-size: 12px; color: rgba(255,255,255,.8); }
  @media (max-width: 400px) {
    .title { font-size: 22px; }
    .tile .candy { font-size: 24px; }
    .panel { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="game-wrap">
  <div class="header">
    <div class="title">🍬 糖果消消乐</div>
    <div class="subtitle" id="levelName">第 1 关 · 甜蜜初尝</div>
  </div>
  <div class="hud">
    <div class="score">🍭 得分 <span id="score">0</span></div>
    <div class="moves">🎯 步数 <span id="moves">0</span></div>
  </div>
  <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
  <div class="board-container">
    <div class="board" id="board"></div>
  </div>
  <div class="tip">💡 选中一颗糖果，再点相邻糖果即可交换；也可以按住拖动</div>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel">
    <h2 id="overlayTitle"></h2>
    <div class="stars" id="stars"></div>
    <p id="overlayText"></p>
    <div class="level-grid" id="levelGrid"></div>
    <button class="btn" id="overlayBtn">开始游戏</button>
  </div>
</div>

<script>
(function () {
  "use strict";
  var ROWS = 8, COLS = 8;
  var CANDIES = ["🍓", "🍋", "🍇", "🍊", "🍏", "🍉", "🍒"];
  var LEVELS = [
    { name: "甜蜜初尝", types: 6, moves: 20, target: 1200 },
    { name: "水果风暴", types: 7, moves: 20, target: 1600 },
    { name: "糖果盛宴", types: 7, moves: 18, target: 2000 }
  ];
  var TYPES = 6;
  var DRAG_THRESHOLD = 18;
  var PROGRESS_KEY = "xiaoxiaole_progress";

  var board = document.getElementById("board");
  var overlay = document.getElementById("overlay");
  var panel = document.getElementById("panel");
  var overlayTitle = document.getElementById("overlayTitle");
  var starsEl = document.getElementById("stars");
  var overlayText = document.getElementById("overlayText");
  var levelGrid = document.getElementById("levelGrid");
  var overlayBtn = document.getElementById("overlayBtn");
  var scoreEl = document.getElementById("score");
  var movesEl = document.getElementById("moves");
  var levelNameEl = document.getElementById("levelName");
  var progressFill = document.getElementById("progressFill");

  var grid = [];
  var tiles = [];
  var score = 0;
  var moves = 0;
  var levelIndex = 0;
  var locked = false;
  var selected = null;
  var dragState = null;
  var progress = loadProgress();

  function loadProgress() {
    try {
      var raw = localStorage.getItem(PROGRESS_KEY);
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && typeof obj.unlocked === "number") return { unlocked: obj.unlocked, stars: obj.stars || {} };
      }
    } catch (e) {}
    return { unlocked: 1, stars: {} };
  }

  function saveProgress() {
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
  }

  function candyForLevel(i) {
    var pool = CANDIES.slice(0, TYPES);
    return pool[i % pool.length];
  }

  function randCandy() {
    return candyForLevel(Math.floor(Math.random() * TYPES));
  }

  function shuffle() {
    do {
      for (var r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (var c = 0; c < COLS; c++) grid[r][c] = randCandy();
      }
    } while (findAllMatches().length > 0);
  }

  function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

  function cellMatches(r, c) {
    var t = grid[r][c];
    if (t == null) return false;
    if (c - 2 >= 0 && grid[r][c-1] === t && grid[r][c-2] === t) return true;
    if (c + 2 < COLS && grid[r][c+1] === t && grid[r][c+2] === t) return true;
    if (r - 2 >= 0 && grid[r-1][c] === t && grid[r-2][c] === t) return true;
    if (r + 2 < ROWS && grid[r+1][c] === t && grid[r+2][c] === t) return true;
    return false;
  }

  function findAllMatches() {
    var matches = [];
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (grid[r][c] != null && cellMatches(r, c)) matches.push([r, c]);
      }
    }
    return matches;
  }

  function collectRuns() {
    var hit = {};
    var runs = [];
    function key(r, c) { return r + "," + c; }
    for (var r = 0; r < ROWS; r++) {
      var run = 1;
      for (var c = 1; c <= COLS; c++) {
        if (c < COLS && grid[r][c] != null && grid[r][c] === grid[r][c-1]) { run++; }
        else {
          if (run >= 3) {
            var cells = [];
            for (var k = c - run; k < c; k++) { cells.push([r, k]); hit[key(r, k)] = true; }
            runs.push(cells);
          }
          run = 1;
        }
      }
    }
    for (var cc = 0; cc < COLS; cc++) {
      var run2 = 1;
      for (var rr = 1; rr <= ROWS; rr++) {
        if (rr < ROWS && grid[rr][cc] != null && grid[rr][cc] === grid[rr-1][cc]) { run2++; }
        else {
          if (run2 >= 3) {
            var cells2 = [];
            for (var k2 = rr - run2; k2 < rr; k2++) { cells2.push([k2, cc]); hit[key(k2, cc)] = true; }
            runs.push(cells2);
          }
          run2 = 1;
        }
      }
    }
    return { runs: runs, hit: hit };
  }

  function swap(r1, c1, r2, c2) {
    var t = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = t;
    updateTile(r1, c1);
    updateTile(r2, c2);
  }

  function canSwap(r1, c1, r2, c2) {
    if (!inBounds(r1, c1) || !inBounds(r2, c2)) return false;
    if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return false;
    if (grid[r1][c1] == null || grid[r2][c2] == null) return false;
    swap(r1, c1, r2, c2);
    var ok = findAllMatches().length > 0;
    swap(r1, c1, r2, c2);
    return ok;
  }

  function applyGravity() {
    for (var c = 0; c < COLS; c++) {
      var write = ROWS - 1;
      for (var r = ROWS - 1; r >= 0; r--) {
        if (grid[r][c] != null) {
          if (write !== r) {
            grid[write][c] = grid[r][c];
            grid[r][c] = null;
          }
          write--;
        }
      }
      for (var rr = write; rr >= 0; rr--) grid[rr][c] = randCandy();
    }
  }

  function render() {
    board.innerHTML = "";
    tiles = [];
    var size = 100 / COLS;
    for (var r = 0; r < ROWS; r++) {
      tiles[r] = [];
      for (var c = 0; c < COLS; c++) {
        (function (rr, cc) {
          var el = document.createElement("div");
          el.className = "tile";
          el.style.width = size + "%";
          el.style.height = size + "%";
          el.style.left = (cc * size) + "%";
          el.style.top = (rr * size) + "%";
          el.style.setProperty("--tx", (cc * size) + "%");
          el.style.setProperty("--ty", (rr * size) + "%");
          var candy = document.createElement("div");
          candy.className = "candy";
          candy.textContent = grid[rr][cc] || "";
          el.appendChild(candy);
          el.dataset.r = rr;
          el.dataset.c = cc;
          el.addEventListener("pointerdown", onPointerDown);
          board.appendChild(el);
          tiles[rr][cc] = el;
        })(r, c);
      }
    }
  }

  function updateTile(r, c) {
    if (!tiles[r] || !tiles[r][c]) return;
    var candy = tiles[r][c].querySelector(".candy");
    if (candy) candy.textContent = grid[r][c] || "";
  }

  function onPointerDown(ev) {
    if (locked) return;
    if (selected) {
      selected.classList.remove("selected");
      selected = null;
    }
    var el = ev.currentTarget;
    var r = Number(el.dataset.r), c = Number(el.dataset.c);
    dragState = {
      startR: r, startC: c, startX: ev.clientX, startY: ev.clientY,
      consumed: false, el: el
    };
    el.setPointerCapture && el.setPointerCapture(ev.pointerId);
  }

  function onPointerMove(ev) {
    if (!dragState || dragState.consumed) return;
    var dx = ev.clientX - dragState.startX;
    var dy = ev.clientY - dragState.startY;
    if (Math.abs(dx) < DRAG_THRESHOLD && Math.abs(dy) < DRAG_THRESHOLD) return;
    var r1 = dragState.startR, c1 = dragState.startC;
    var r2 = r1, c2 = c1;
    if (Math.abs(dx) > Math.abs(dy)) { c2 = c1 + (dx > 0 ? 1 : -1); }
    else { r2 = r1 + (dy > 0 ? 1 : -1); }
    dragState.consumed = true;
    if (canSwap(r1, c1, r2, c2)) {
      doSwap(r1, c1, r2, c2);
    } else {
      markTile(r1, c1);
    }
  }

  function onPointerEnd(ev) {
    if (!dragState) return;
    var st = dragState;
    dragState = null;
    if (st.consumed) return;
    var el = st.el;
    var r = Number(el.dataset.r), c = Number(el.dataset.c);
    if (selected && selected !== el) {
      var sr = Number(selected.dataset.r), sc = Number(selected.dataset.c);
      if (Math.abs(sr - r) + Math.abs(sc - c) === 1 && canSwap(sr, sc, r, c)) {
        doSwap(sr, sc, r, c);
        return;
      }
      selected.classList.remove("selected");
      selected = null;
    }
    if (selected === el) {
      selected.classList.remove("selected");
      selected = null;
      return;
    }
    selected = el;
    el.classList.add("selected");
  }

  document.addEventListener("pointermove", onPointerMove);
  document.addEventListener("pointerup", onPointerEnd);
  document.addEventListener("pointercancel", onPointerEnd);

  function markTile(r, c) {
    if (locked) return;
    if (selected) { selected.classList.remove("selected"); selected = null; }
    selected = tiles[r][c];
    selected.classList.add("selected");
    setTimeout(function () {
      if (selected) { selected.classList.remove("selected"); selected = null; }
    }, 350);
  }

  function doSwap(r1, c1, r2, c2) {
    swap(r1, c1, r2, c2);
    var t1 = tiles[r1][c1], t2 = tiles[r2][c2];
    t1.classList.add("swap");
    t2.classList.add("swap");
    setTimeout(function () { t1.classList.remove("swap"); t2.classList.remove("swap"); }, 320);
    moves++;
    updateHUD();
    resolveBoard();
  }

  function resolveBoard() {
    locked = true;
    var found = collectRuns();
    if (found.runs.length === 0) {
      locked = false;
      checkGameState();
      return;
    }
    var popCells = [];
    for (var i = 0; i < found.runs.length; i++) {
      popCells = popCells.concat(found.runs[i]);
    }
    var gained = popCells.length * 10;
    score += gained;
    updateHUD();
    popCells.forEach(function (p) {
      var el = tiles[p[0]][p[1]];
      el.classList.add("pop");
    });
    setTimeout(function () {
      popCells.forEach(function (p) {
        grid[p[0]][p[1]] = null;
        tiles[p[0]][p[1]].classList.remove("pop", "selected");
        updateTile(p[0], p[1]);
      });
      applyGravity();
      render();
      selected = null;
      setTimeout(resolveBoard, 60);
    }, 400);
  }

  function updateHUD() {
    scoreEl.textContent = score;
    movesEl.textContent = moves + " / " + LEVELS[levelIndex].moves;
    var pct = Math.min(100, Math.round(score / LEVELS[levelIndex].target * 100));
    progressFill.style.width = pct + "%";
  }

  function checkGameState() {
    var lv = LEVELS[levelIndex];
    if (score >= lv.target) {
      showOverlay("🎉 过关！", lv.name + " 完成", starsFor(lv), true);
      return;
    }
    if (moves >= lv.moves) {
      showOverlay("😢 步数用尽", "还差 " + (lv.target - score) + " 分，再试一次吧", 0, false);
    }
  }

  function starsFor(lv) {
    var remain = lv.moves - moves;
    if (remain >= Math.ceil(lv.moves * 0.25)) return 3;
    if (remain >= 1) return 2;
    return 1;
  }

  function renderStars(n) {
    var html = "";
    for (var i = 1; i <= 3; i++) html += i <= n ? "⭐" : "<span class=\"off\">⭐</span>";
    starsEl.innerHTML = html;
  }

  function showOverlay(title, text, stars, win) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    renderStars(stars);
    buildLevelGrid(win);
    overlayBtn.textContent = win ? "下一关" : "重新挑战";
    overlayBtn.onclick = function () {
      if (win) {
        if (levelIndex < LEVELS.length - 1) {
          levelIndex++;
          if (progress.unlocked < levelIndex + 1) {
            progress.unlocked = levelIndex + 1;
            progress.stars[levelIndex] = Math.max(progress.stars[levelIndex] || 0, stars);
            saveProgress();
          }
        }
        startLevel(levelIndex);
      } else {
        startLevel(levelIndex);
      }
    };
    overlay.classList.add("show");
  }

  function buildLevelGrid(win) {
    levelGrid.innerHTML = "";
    for (var i = 0; i < LEVELS.length; i++) {
      (function (idx) {
        var card = document.createElement("div");
        card.className = "level-card" + (idx + 1 > progress.unlocked ? " locked" : "");
        var s = progress.stars[idx] || 0;
        card.innerHTML = "<div class=\"lc-name\">" + (idx + 1) + ". " + LEVELS[idx].name + "</div>" +
          "<div class=\"lc-meta\">目标 " + LEVELS[idx].target + " 分 · " + LEVELS[idx].moves + " 步</div>" +
          "<div class=\"lc-stars\">" + "⭐".repeat(Math.max(0, s)) + "</div>";
        card.addEventListener("click", function () {
          if (idx + 1 <= progress.unlocked) {
            levelIndex = idx;
            startLevel(idx);
          }
        });
        levelGrid.appendChild(card);
      })(i);
    }
  }

  function startLevel(idx) {
    levelIndex = idx;
    var lv = LEVELS[idx];
    TYPES = lv.types;
    score = 0;
    moves = 0;
    locked = false;
    selected = null;
    dragState = null;
    levelNameEl.textContent = "第 " + (idx + 1) + " 关 · " + lv.name;
    shuffle();
    render();
    updateHUD();
    overlay.classList.remove("show");
    setTimeout(showHint, 900);
  }

  function findHint() {
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var dirs = [[0,1],[1,0]];
        for (var d = 0; d < dirs.length; d++) {
          var r2 = r + dirs[d][0], c2 = c + dirs[d][1];
          if (canSwap(r, c, r2, c2)) return [r, c, r2, c2];
        }
      }
    }
    return null;
  }

  function showHint() {
    if (locked || overlay.classList.contains("show")) return;
    var h = findHint();
    if (h) {
      tiles[h[0]][h[1]].classList.add("hint");
      tiles[h[2]][h[3]].classList.add("hint");
      setTimeout(function () {
        if (!locked && !overlay.classList.contains("show")) {
          tiles[h[0]][h[1]].classList.remove("hint");
          tiles[h[2]][h[3]].classList.remove("hint");
        }
      }, 1200);
    }
  }

  function init() {
    buildLevelGrid(false);
    startLevel(Math.min(progress.unlocked - 1, LEVELS.length - 1));
  }

  init();
})();
</script>
</body>
</html>
