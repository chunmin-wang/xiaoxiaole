<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>糖果消消乐 · Candy Match</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --cell: 56px;
    --gap: 6px;
    --board-pad: 10px;
    --accent: #ff6fb5;
    --accent2: #ffd166;
    --bg1: #5b2a86;
    --bg2: #b23a9e;
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(160deg, #5b2a86 0%, #a2379c 55%, #e2588b 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  /* floating bokeh background */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.16) 0, transparent 42px),
      radial-gradient(circle at 85% 12%, rgba(255,255,255,.12) 0, transparent 60px),
      radial-gradient(circle at 78% 82%, rgba(255,255,255,.14) 0, transparent 50px),
      radial-gradient(circle at 22% 78%, rgba(255,255,255,.10) 0, transparent 45px);
  }
  .game-wrap { position: relative; z-index: 1; }

  .hud {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 14px;
  }
  .stat {
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 14px;
    padding: 8px 14px; min-width: 96px; text-align: center;
    backdrop-filter: blur(4px);
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  .stat .label { font-size: 11px; opacity: .85; letter-spacing: 1px; }
  .stat .value { font-size: 22px; font-weight: 800; line-height: 1.15; text-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .stat.target .value { font-size: 17px; }
  .title-tag {
    font-size: 20px; font-weight: 900; letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0,0,0,.18);
    white-space: nowrap;
  }

  .board-box {
    position: relative;
    background: rgba(255,255,255,.13);
    border: 2px solid rgba(255,255,255,.35);
    border-radius: 20px;
    padding: var(--board-pad);
    box-shadow: 0 18px 50px rgba(0,0,0,.4), inset 0 0 30px rgba(255,255,255,.08);
  }
  .board {
    position: relative;
    width: calc(var(--cell) * 8 + var(--gap) * 7);
    height: calc(var(--cell) * 8 + var(--gap) * 7);
    background: rgba(30,10,50,.25);
    border-radius: 12px;
    overflow: hidden;
  }
  /* underlying grid dots */
  .cell-grid {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    gap: var(--gap);
    padding: 0;
  }
  .cell-grid i {
    background: rgba(255,255,255,.05);
    border-radius: 10px;
  }
  .tile {
    position: absolute;
    width: var(--cell);
    height: var(--cell);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    cursor: pointer;
    transition: transform .18s ease, box-shadow .18s ease, opacity .25s ease, filter .18s ease;
    will-change: transform;
    z-index: 2;
    background: rgba(255,255,255,.08);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 3px 8px rgba(0,0,0,.22);
    text-shadow: 0 2px 6px rgba(0,0,0,.35);
  }
  .tile .gem { line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .tile.selected {
    outline: 3px solid #fff;
    outline-offset: -1px;
    transform: scale(1.14);
    box-shadow: 0 0 0 4px rgba(255,255,255,.35), 0 8px 20px rgba(0,0,0,.4);
    z-index: 6;
    animation: pulse 0.9s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1.12); }
    50% { transform: scale(1.18); }
  }
  .tile.hint {
    animation: hintPop 1.1s ease-in-out infinite;
  }
  @keyframes hintPop {
    0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,220,80,.7); }
    50% { transform: scale(1.12); box-shadow: 0 0 0 8px rgba(255,220,80,0); }
  }
  .tile.pop {
    animation: popAnim .35s ease forwards;
    z-index: 5;
  }
  @keyframes popAnim {
    0% { transform: scale(1); opacity: 1; }
    40% { transform: scale(1.3) rotate(10deg); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
  }

  .score-pop {
    position: absolute;
    font-weight: 900;
    font-size: 26px;
    color: #ffe66d;
    text-shadow: 0 2px 0 rgba(120,40,0,.5), 0 4px 14px rgba(0,0,0,.5);
    pointer-events: none;
    z-index: 20;
    animation: floatUp 0.9s ease-out forwards;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    20% { transform: translateY(-10px) scale(1.15); opacity: 1; }
    100% { transform: translateY(-60px) scale(1); opacity: 0; }
  }
  .combo-banner {
    position: absolute; left: 50%; top: 40%;
    transform: translate(-50%, -50%);
    font-size: 30px; font-weight: 900;
    color: #fff; letter-spacing: 2px;
    text-shadow: 0 3px 0 rgba(0,0,0,.35), 0 0 24px rgba(255,215,0,.9);
    z-index: 30; pointer-events: none;
    animation: comboPop 1.1s ease forwards;
    white-space: nowrap;
  }
  @keyframes comboPop {
    0% { transform: translate(-50%,-50%) scale(.3) rotate(-8deg); opacity: 0; }
    25% { transform: translate(-50%,-50%) scale(1.25) rotate(3deg); opacity: 1; }
    45% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 1; }
    80% { transform: translate(-50%,-50%) scale(1.05); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1.15); opacity: 0; }
  }

  .controls {
    display: flex; gap: 10px; margin-top: 14px; justify-content: center;
  }
  .btn {
    flex: 1;
    border: none; cursor: pointer;
    background: linear-gradient(180deg, #ffd166, #ff9f43);
    color: #6b3b00; font-weight: 800; font-size: 16px;
    padding: 11px 0; border-radius: 13px;
    box-shadow: 0 5px 0 #d17f2a, 0 8px 18px rgba(0,0,0,.3);
    transition: transform .08s ease, box-shadow .08s ease;
    letter-spacing: 1px;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #d17f2a; }
  .btn.secondary { background: linear-gradient(180deg,#8fd3ff,#4aa3ff); color: #073a63; box-shadow: 0 5px 0 #2f7dd0; }
  .btn.secondary:active { box-shadow: 0 1px 0 #2f7dd0; }

  /* overlay */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(30,8,50,.72);
    backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center;
    transition: opacity .3s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .panel {
    background: linear-gradient(180deg, #7b2f9e, #5b1f7d);
    border: 2px solid rgba(255,255,255,.4);
    border-radius: 24px;
    padding: 34px 38px;
    text-align: center;
    max-width: 420px; width: 90%;
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
    animation: panelIn .35s ease;
  }
  @keyframes panelIn {
    0% { transform: scale(.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .panel h1 { font-size: 34px; letter-spacing: 2px; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  .panel .sub { margin-top: 10px; font-size: 15px; opacity: .92; line-height: 1.6; }
  .panel .big { font-size: 20px; font-weight: 800; margin-top: 12px; }
  .panel .rule {
    background: rgba(255,255,255,.1); border-radius: 12px; padding: 12px 14px;
    margin: 16px 0; font-size: 13.5px; line-height: 1.7; text-align: left;
  }
  .panel .rule b { color: #ffe66d; }
  .panel .btn { width: 100%; margin-top: 6px; font-size: 18px; }
  .stars { font-size: 40px; margin: 10px 0; letter-spacing: 6px; }

  /* confetti */
  .confetti {
    position: fixed; top: -20px; width: 10px; height: 14px; z-index: 90;
    pointer-events: none; opacity: .95;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  @media (max-width: 520px) {
    :root { --cell: 44px; --gap: 5px; }
    .tile { font-size: 26px; }
    .title-tag { font-size: 16px; }
    .stat { min-width: 76px; padding: 6px 8px; }
    .stat .value { font-size: 18px; }
    .stat.target .value { font-size: 15px; }
  }
  @media (max-width: 400px) {
    :root { --cell: 36px; --gap: 4px; }
    .tile { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="game-wrap">
  <div class="hud">
    <div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div>
    <div class="title-tag">🍬 糖果消消乐</div>
    <div class="stat target"><div class="label">目标</div><div class="value" id="target">1000</div></div>
    <div class="stat"><div class="label">剩余步数</div><div class="value" id="moves">20</div></div>
  </div>

  <div class="board-box">
    <div class="board" id="board">
      <div class="cell-grid" id="cellGrid"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn secondary" id="hintBtn">💡 提示</button>
    <button class="btn secondary" id="restartBtn">🔄 重开</button>
  </div>
</div>

<!-- start overlay -->
<div class="overlay" id="startOverlay">
  <div class="panel">
    <h1>🍭 糖果消消乐</h1>
    <div class="sub">经典三消 · 连击加成 · 爽快消除</div>
    <div class="rule">
      <b>玩法：</b>点击选中糖果，再点击相邻糖果交换位置。<br>
      三个及以上相同糖果连成一线即可消除。<br>
      消除后上方糖果会<b>下落补充</b>，连续消除会触发<b>连击加成</b>！<br>
      在<b>限定步数</b>内达到<b>目标分数</b>即可通关 ⭐
    </div>
    <button class="btn" id="startBtn">🎮 开始游戏</button>
  </div>
</div>

<!-- result overlay -->
<div class="overlay hidden" id="resultOverlay">
  <div class="panel">
    <div class="stars" id="stars">⭐⭐⭐</div>
    <h1 id="resultTitle">通关！</h1>
    <div class="big" id="resultScore">得分 0</div>
    <div class="sub" id="resultMsg"></div>
    <button class="btn" id="againBtn">🔁 再来一局</button>
  </div>
</div>

<script>
"use strict";
/* ============ 常量 ============ */
const ROWS = 8, COLS = 8, TYPES = 6;
const CANDIES = ["🍓","🍋","🍇","🍊","🫐","🍏"];
const COLORS = ["#ff5d7e","#ffd34d","#b26bff","#ff9a3d","#5fb8ff","#7ed957"];
const MAX_MOVES = 20;
const TARGET = 1200;

/* ============ 状态 ============ */
let board = [];           // board[r][c] = type 或 -1(空)
let score = 0, movesLeft = MAX_MOVES;
let selected = null;      // {r,c}
let busy = false;         // 动画进行中
let hintTimer = null;
let gameEnded = false;

const boardEl = document.getElementById("board");
const cellGridEl = document.getElementById("cellGrid");
const scoreEl = document.getElementById("score");
const targetEl = document.getElementById("target");
const movesEl = document.getElementById("moves");

/* 画布几何 */
const CELL = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--cell"));
const GAP = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap"));
const STEP = CELL + GAP;

/* ============ 音效 (Web Audio) ============ */
let audioCtx = null;
function beep(freq, dur, type="sine", vol=0.12) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
function sfxSelect() { beep(520, .07, "sine", .08); }
function sfxSwap()   { beep(660, .06, "triangle", .08); }
function sfxBad()    { beep(180, .16, "sawtooth", .08); }
function sfxMatch(n) { const base = 500 + n*60; [0,1,2].forEach(i=>setTimeout(()=>beep(base+i*90,.09,"triangle",.1), i*45)); }
function sfxCombo(n) { beep(300+n*120, .18, "square", .08); }
function sfxWin()    { [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.16,"triangle",.12),i*110)); }
function sfxLose()   { [400,320,260,180].forEach((f,i)=>setTimeout(()=>beep(f,.2,"sine",.1),i*130)); }

/* ============ 棋盘逻辑 ============ */
function randType() { return Math.floor(Math.random() * TYPES); }

function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      let t;
      do {
        t = randType();
      } while (
        (c >= 2 && board[r][c-1] === t && board[r][c-2] === t) ||
        (r >= 2 && board[r-1][c] === t && board[r-2][c] === t)
      );
      board[r][c] = t;
    }
  }
}

function inBounds(r,c){ return r>=0 && r<ROWS && c>=0 && c<COLS; }

function findMatches() {
  const matches = new Set();
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const t = board[r][c];
      let len = 1;
      while (c+len < COLS && board[r][c+len] === t) len++;
      if (len >= 3) for (let k=0;k<len;k++) matches.add(r+","+(c+k));
      c += len;
    }
  }
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const t = board[r][c];
      let len = 1;
      while (r+len < ROWS && board[r+len][c] === t) len++;
      if (len >= 3) for (let k=0;k<len;k++) matches.add((r+k)+","+c);
      r += len;
    }
  }
  return matches;
}

function clearMatches(matches) {
  let n = 0;
  matches.forEach(key => {
    const [r,c] = key.split(",").map(Number);
    board[r][c] = -1;
    n++;
  });
  return n;
}

function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] !== -1) {
        if (write !== r) { board[write][c] = board[r][c]; board[r][c] = -1; }
        write--;
      }
    }
    for (let r = write; r >= 0; r--) {
      board[r][c] = randType();
    }
  }
}

function hasAnyMove() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    for (const [dr,dc] of [[0,1],[1,0]]) {
      const r2=r+dr, c2=c+dc;
      if (!inBounds(r2,c2)) continue;
      swap(r,c,r2,c2);
      const has = findMatches().size > 0;
      swap(r,c,r2,c2);
      if (has) return true;
    }
  }
  return false;
}

function swap(r,c,r2,c2){ const t=board[r][c]; board[r][c]=board[r2][c2]; board[r2][c2]=t; }

/* ============ 渲染 ============ */
function px(r,c){ return { x: c*STEP, y: r*STEP }; }

function renderAll() {
  selected = null;               // 清空选中状态（旧格子已全部移除）
  boardEl.querySelectorAll(".tile").forEach(el=>el.remove());
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    createTile(r, c, board[r][c], true);
  }
}

function createTile(r, c, type, instant) {
  const el = document.createElement("div");
  el.className = "tile";
  el.dataset.r = r; el.dataset.c = c;
  const p = px(r,c);
  el.style.transform = `translate(${p.x}px, ${p.y}px)`;
  if (instant) { el.style.transition = "none"; requestAnimationFrame(()=>requestAnimationFrame(()=>el.style.transition="")); }
  el.innerHTML = `<span class="gem">${CANDIES[type]}</span>`;
  // 注意：必须在点击时读取元素当前 data-r/data-c，不能闭包捕获创建时的坐标
  // （否则糖果下落后点击会触发旧位置的逻辑，导致换错格）
  el.addEventListener("pointerdown", () => onTileClick(Number(el.dataset.r), Number(el.dataset.c)));
  boardEl.appendChild(el);
  return el;
}

function moveTileTo(el, r, c) {
  el.dataset.r = r; el.dataset.c = c;
  const p = px(r,c);
  el.style.transform = `translate(${p.x}px, ${p.y}px)`;
}

function tileAt(r,c){ return boardEl.querySelector(`.tile[data-r="${r}"][data-c="${c}"]`); }

/* ============ 交互 ============ */
function onTileClick(r, c) {
  if (busy || gameEnded) return;
  const el = tileAt(r, c);
  if (!el) return;               // 该格已被消除/重组移除，忽略本次点击
  if (!selected) {
    selected = {r,c};
    el.classList.add("selected");
    sfxSelect();
    return;
  }
  const s = selected;
  if (s.r === r && s.c === c) {
    el.classList.remove("selected");
    selected = null;
    return;
  }
  // 相邻？
  const adj = Math.abs(s.r-r) + Math.abs(s.c-c) === 1;
  if (!adj) {
    // 重新选择
    const selEl = tileAt(s.r, s.c);
    if (selEl) selEl.classList.remove("selected");
    selected = {r,c};
    el.classList.add("selected");
    sfxSelect();
    return;
  }
  const selEl = tileAt(s.r, s.c);
  if (selEl) selEl.classList.remove("selected");
  selected = null;
  trySwap(s.r, s.c, r, c);
}

async function trySwap(r1,c1,r2,c2) {
  busy = true;
  const a = tileAt(r1,c1), b = tileAt(r2,c2);
  if (!a || !b) { busy = false; return; }
  swap(r1,c1,r2,c2);
  moveTileTo(a, r2, c2);
  moveTileTo(b, r1, c1);
  await wait(200);
  if (findMatches().size === 0) {
    // 无效交换，换回
    sfxBad();
    swap(r1,c1,r2,c2);
    moveTileTo(a, r1, c1);
    moveTileTo(b, r2, c2);
    await wait(200);
    busy = false;
    return;
  }
  sfxSwap();
  movesLeft--;
  updateHud();
  await resolveBoard(0);
  busy = false;
  if (!gameEnded) checkGameState();
}

async function resolveBoard(combo) {
  const matches = findMatches();
  if (matches.size === 0) {
    // 确保有可走步数
    if (!hasAnyMove()) {
      await reshuffle();
      if (findMatches().size > 0) await resolveBoard(0);
    }
    return;
  }
  combo++;
  const n = matches.size;
  const points = n * 10 * combo;
  score += points;
  // 弹分 & 音效
  const rect = boardEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/3;
  showScorePop(points, cx, cy, combo);
  if (combo >= 2) showCombo(combo);
  sfxMatch(combo); if (combo >= 2) sfxCombo(combo);

  // 消除动画
  const els = [];
  matches.forEach(key => {
    const [r,c] = key.split(",").map(Number);
    const el = tileAt(r,c);
    if (el) { el.classList.add("pop"); els.push(el); }
  });
  clearMatches(matches);
  await wait(300);
  els.forEach(el=>el.remove());

  // 下落 + 补充
  applyGravity();
  for (let c = 0; c < COLS; c++) {
    // 收集该列现存格子（自底向上，保持原相对顺序）
    const colTiles = [];
    for (let r = ROWS - 1; r >= 0; r--) {
      const el = tileAt(r, c);
      if (el) colTiles.push(el);
    }
    // 现存在底端自下而上落位
    let targetRow = ROWS - 1;
    for (const el of colTiles) {
      moveTileTo(el, targetRow, c);
      targetRow--;
    }
    // 顶部缺口补新糖果（从棋盘上方落入）
    for (let r = targetRow; r >= 0; r--) {
      const type = board[r][c];
      const nEl = createTile(r, c, type, false);
      nEl.style.transition = "none";
      const above = px(r - ROWS - 2, c);
      nEl.style.transform = `translate(${above.x}px, ${above.y}px)`;
      void nEl.offsetWidth; // 强制回流，确保初始位置生效
      nEl.style.transition = "transform .3s ease";
      moveTileTo(nEl, r, c);
    }
  }
  updateHud();
  await wait(330);
  await resolveBoard(combo);
}

async function reshuffle() {
  // 重新洗牌直到可走
  let guard = 0;
  do {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) board[r][c] = randType();
    guard++;
  } while ((findMatches().size > 0 || !hasAnyMove()) && guard < 100);
  renderAll();
  await wait(120);
}

/* ============ 特效 ============ */
function wait(ms){ return new Promise(res=>setTimeout(res, ms)); }

function showScorePop(points, x, y, combo) {
  const el = document.createElement("div");
  el.className = "score-pop";
  el.textContent = "+" + points;
  el.style.left = (x - 30 + (Math.random()*40-20)) + "px";
  el.style.top = (y + (Math.random()*20-10)) + "px";
  if (combo >= 2) { el.style.fontSize = "34px"; el.textContent = "+" + points + " 连击×" + combo; }
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 950);
}

function showCombo(n) {
  const names = ["", "", "连击 x2！", "三重连击 x3！", "超级连击 x4！", "逆天连击 x5！", "传说连击 x6！"];
  const el = document.createElement("div");
  el.className = "combo-banner";
  el.textContent = names[Math.min(n, names.length-1)] + (n >= 3 ? " 🔥" : "");
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1100);
}

function confetti() {
  const colors = ["#ff5d7e","#ffd34d","#7ed957","#5fb8ff","#b26bff","#ff9a3d","#fff"];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    c.style.animationDuration = (2 + Math.random()*2) + "s";
    c.style.animationDelay = (Math.random()*0.8) + "s";
    c.style.width = (6 + Math.random()*8) + "px";
    c.style.height = (8 + Math.random()*10) + "px";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5200);
  }
}

/* ============ UI ============ */
function updateHud() {
  scoreEl.textContent = score;
  movesEl.textContent = movesLeft;
  targetEl.textContent = TARGET;
  // 进度条效果：分数颜色变化
  scoreEl.style.color = score >= TARGET ? "#7dffa8" : "#fff";
}

function checkGameState() {
  if (gameEnded) return;
  if (score >= TARGET) {
    gameEnded = true;
    sfxWin(); confetti();
    showResult(true);
  } else if (movesLeft <= 0) {
    gameEnded = true;
    sfxLose();
    showResult(false);
  }
}

function showResult(win) {
  const overlay = document.getElementById("resultOverlay");
  document.getElementById("resultTitle").textContent = win ? "🎉 通关成功！" : "😢 步数用完了";
  document.getElementById("stars").textContent = win ? "⭐⭐⭐" : "⭐";
  document.getElementById("resultScore").textContent = "得分 " + score + " / 目标 " + TARGET;
  document.getElementById("resultMsg").textContent = win
    ? "太棒了！剩余 " + movesLeft + " 步，刷新纪录吧！"
    : "差一点就通关啦，再试一次吧！";
  overlay.classList.remove("hidden");
}

/* ============ 提示 ============ */
function findHint() {
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    for (const [dr,dc] of [[0,1],[1,0]]) {
      const r2=r+dr, c2=c+dc;
      if (!inBounds(r2,c2)) continue;
      swap(r,c,r2,c2);
      const has = findMatches().size > 0;
      swap(r,c,r2,c2);
      if (has) return [r,c,r2,c2];
    }
  }
  return null;
}

function showHint() {
  if (busy || gameEnded) return;
  clearHint();
  const h = findHint();
  if (!h) { showScorePop(0, innerWidth/2, innerHeight/3, 0); return; }
  const [r1,c1,r2,c2] = h;
  [tileAt(r1,c1), tileAt(r2,c2)].forEach(el=>el && el.classList.add("hint"));
  hintTimer = setTimeout(clearHint, 1500);
}
function clearHint(){ boardEl.querySelectorAll(".hint").forEach(el=>el.classList.remove("hint")); clearTimeout(hintTimer); }

/* ============ 开始 / 重开 ============ */
function startGame() {
  score = 0; movesLeft = MAX_MOVES; gameEnded = false; busy = false;
  selected = null;
  initBoard();
  renderAll();
  updateHud();
  document.getElementById("startOverlay").classList.add("hidden");
  document.getElementById("resultOverlay").classList.add("hidden");
}

/* ============ 事件绑定 ============ */
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("againBtn").addEventListener("click", startGame);
document.getElementById("restartBtn").addEventListener("click", startGame);
document.getElementById("hintBtn").addEventListener("click", showHint);

/* 生成网格底纹 */
for (let i = 0; i < ROWS*COLS; i++) cellGridEl.appendChild(document.createElement("i"));

/* 初始化首屏棋盘预览 */
initBoard();
renderAll();
updateHud();
</script>
